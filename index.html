<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/logo.png">
  <title>SonicPure AI: Studio-clean audio in minutes</title>
  <meta name="description" content="Remove background noise, filler words, breaths and dead air from podcasts, sermons, lectures and videos. Get transcripts, summaries and social posts in one pass.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply the saved or system theme before first paint to avoid a flash.
    (function () {
      try {
        var saved = localStorage.getItem('sp-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script src="https://js.paystack.co/v2/inline.js" async></script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
